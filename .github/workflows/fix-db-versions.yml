# .github/workflows/fix-db-versions.yml
name: 🔧 DB Fix & Diagnóstico

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        required: true
        type: choice
        options:
          - diagnose
          - fix-dry-run
          - fix-apply
          - clean-db
          - clean-dry-run
          - full-pipeline
        default: diagnose
      marca:
        description: 'Marca a analizar (vacío = todas)'
        required: false
        type: string
        default: 'chevrolet'
      verbose:
        description: 'Modo verbose'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  fix-database:
    name: 🔧 ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ═══ FIX CRÍTICO: @v3 → @v6 ═══
      - name: 📥 Descargar BD maestra
        id: download-db
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success
          if_no_artifact_found: warn
          search_artifacts: true
          allow_forks: false

      - name: 📋 Verificar BD
        run: |
          if [ -f "rosariogarage.db" ]; then
            TOTAL=$(sqlite3 rosariogarage.db "SELECT COUNT(*) FROM vehicles;")
            ACTIVOS=$(sqlite3 rosariogarage.db "SELECT COUNT(*) FROM vehicles WHERE activo=1;")
            echo "✅ BD: $TOTAL total | $ACTIVOS activos"
          else
            echo "❌ BD no encontrada - ejecutá el scraper primero"
            exit 1
          fi

      - name: 🔍 Diagnóstico
        if: inputs.action == 'diagnose' || inputs.action == 'full-pipeline'
        run: |
          ARGS="--db rosariogarage.db --dicts config/normalizer_dicts.json"
          if [ -n "${{ inputs.marca }}" ]; then
            ARGS="$ARGS --marca ${{ inputs.marca }}"
          else
            ARGS="$ARGS --all-brands"
          fi
          if [ "${{ inputs.verbose }}" == "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          python diagnose_versions.py $ARGS || true

      - name: 🔧 Fix versiones (dry-run)
        if: inputs.action == 'fix-dry-run'
        run: |
          ARGS="--db rosariogarage.db --dicts config/normalizer_dicts.json --fix --dry-run"
          if [ -n "${{ inputs.marca }}" ]; then
            ARGS="$ARGS --marca ${{ inputs.marca }}"
          else
            ARGS="$ARGS --all-brands"
          fi
          if [ "${{ inputs.verbose }}" == "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          python diagnose_versions.py $ARGS || true

      - name: 🔧 Fix versiones (aplicar)
        if: inputs.action == 'fix-apply' || inputs.action == 'full-pipeline'
        run: |
          ARGS="--db rosariogarage.db --dicts config/normalizer_dicts.json --fix"
          if [ -n "${{ inputs.marca }}" ]; then
            ARGS="$ARGS --marca ${{ inputs.marca }}"
          else
            ARGS="$ARGS --all-brands"
          fi
          if [ "${{ inputs.verbose }}" == "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          python diagnose_versions.py $ARGS

      - name: 🧹 DB Cleaner (dry-run)
        if: inputs.action == 'clean-dry-run'
        run: |
          ARGS="--db rosariogarage.db --dry-run"
          if [ "${{ inputs.verbose }}" == "true" ]; then ARGS="$ARGS --verbose"; fi
          python db_cleaner.py $ARGS

      - name: 🧹 DB Cleaner (aplicar)
        if: inputs.action == 'clean-db' || inputs.action == 'full-pipeline'
        run: |
          ARGS="--db rosariogarage.db"
          if [ "${{ inputs.verbose }}" == "true" ]; then ARGS="$ARGS --verbose"; fi
          python db_cleaner.py $ARGS

      - name: 📊 Estado final
        if: always()
        run: |
          if [ -f "rosariogarage.db" ]; then
            sqlite3 rosariogarage.db "
              SELECT COALESCE(norm_status, 'NULL') as status, COUNT(*) as total
              FROM vehicles WHERE activo = 1
              GROUP BY norm_status ORDER BY total DESC;
            "
          fi

      - name: 📤 Subir BD corregida
        if: >-
          success() && (
            inputs.action == 'fix-apply' ||
            inputs.action == 'clean-db' ||
            inputs.action == 'full-pipeline'
          )
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          overwrite: true

      - name: 📦 Subir BD para dashboard
        if: >-
          success() && (
            inputs.action == 'fix-apply' ||
            inputs.action == 'clean-db' ||
            inputs.action == 'full-pipeline'
          )
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          overwrite: true
