name: 📊 Análisis de Oportunidades

on:
  # Ejecutar después del scraping diario (7:00 UTC, una hora después)
  # Ejecutar manualmente
  workflow_dispatch:
    inputs:
      generate_csv:
        description: 'Generar CSV para investigación'
        type: boolean
        default: true

jobs:
  analyze:
    name: 🎯 Analizar Mercado
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Descargar BD más reciente
        uses: dawidd6/action-download-artifact@v3
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success

      - name: 📂 Crear directorios de config
        run: |
          mkdir -p config reports
          
          # Crear config de análisis si no existe
          if [ ! -f config/analysis_config.json ]; then
            cat > config/analysis_config.json << 'EOF'
          {
            "filtering": {
              "min_price_usd": 1000,
              "max_price_usd": 500000,
              "min_year": 1990,
              "max_year": 2025,
              "min_samples_for_stats": 5
            },
            "statistics": {
              "spread_threshold_high": 15,
              "volume_threshold_high": 10,
              "anomaly_threshold_percent": 15
            },
            "scoring": {
              "weight_price_discount": 0.25,
              "weight_days_published": 0.15,
              "weight_price_drops": 0.15,
              "weight_seller_type": 0.15,
              "weight_urgency": 0.10
            },
            "pricing": {
              "first_offer_discount": 0.15,
              "target_price_discount": 0.08,
              "max_price_margin": 0.05,
              "estimated_costs_percent": 0.03
            }
          }
          EOF
          fi
          
          # Crear aliases si no existe
          if [ ! -f config/brand_aliases.json ]; then
            cat > config/brand_aliases.json << 'EOF'
          {
            "brand_aliases": {
              "vw": "volkswagen",
              "volks": "volkswagen",
              "chev": "chevrolet",
              "chevy": "chevrolet",
              "mercedes": "mercedes-benz",
              "mb": "mercedes-benz"
            },
            "brands_to_skip": []
          }
          EOF
          fi

      - name: 📋 Verificar BD
        run: |
          echo "📊 Información de la base de datos:"
          ls -lh rosariogarage.db
          
          echo ""
          echo "📈 Estadísticas rápidas:"
          sqlite3 rosariogarage.db "SELECT COUNT(*) as 'Vehículos activos:' FROM vehicles WHERE activo = 1;"
          sqlite3 rosariogarage.db "SELECT COUNT(DISTINCT marca) as 'Marcas únicas:' FROM vehicles WHERE activo = 1 AND marca IS NOT NULL;"
          
          echo ""
          echo "👤 Tipo de vendedores:"
          sqlite3 rosariogarage.db "SELECT 
            CASE WHEN es_particular = 1 THEN 'Particulares' ELSE 'Agencias' END as tipo,
            COUNT(*) as cantidad
          FROM vehicles WHERE activo = 1 GROUP BY es_particular;"

      - name: 🎯 Ejecutar análisis
        run: |
          python opportunity_analyzer.py --report --csv --debug

      - name: 📤 Subir reportes como artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: reports/
          retention-days: 30

      - name: 📝 Mostrar resumen en Job Summary
        run: |
          echo "# 📊 Análisis de Oportunidades" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fecha:** $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f reports/MARKET_ANALYSIS.md ]; then
            echo "## 🎯 Resumen del Mercado" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Extraer primeras secciones del reporte
            head -100 reports/MARKET_ANALYSIS.md >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          
          if [ -f reports/OPPORTUNITIES.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🔥 Top Oportunidades" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Extraer primeras oportunidades
            head -80 reports/OPPORTUNITIES.md | tail -70 >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Descargar reportes completos:** Ver Artifacts" >> $GITHUB_STEP_SUMMARY
