# .github/workflows/fix-db.yml
name: 🧹 Corregir Base de Datos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no aplicar cambios)'
        required: false
        type: boolean
        default: false
      notify_dashboard:
        description: 'Notificar al dashboard'
        required: false
        type: boolean
        default: true
      skip_strategy_c:
        description: 'Saltar Estrategia C (re-matching versiones)'
        required: false
        type: boolean
        default: false
      only_strategy_c:
        description: 'Ejecutar SOLO Estrategia C'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  fix-database:
    name: 🔧 Corregir y Re-normalizar
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ═══ FIX CRÍTICO: @v3 → @v6 ═══
      - name: 📥 Descargar BD maestra actual
        id: download-db
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success
          if_no_artifact_found: warn
          search_artifacts: true
          allow_forks: false

      # ═══ FIX: Verificar con mensaje claro si no existe ═══
      - name: 📋 Verificar BD descargada
        id: check-db
        run: |
          if [ ! -f "rosariogarage.db" ]; then
            echo ""
            echo "══════════════════════════════════════════════"
            echo "❌ ERROR: No se encontró rosariogarage.db"
            echo "══════════════════════════════════════════════"
            echo ""
            echo "CAUSA: El scraper nunca se ejecutó exitosamente"
            echo ""
            echo "SOLUCIÓN:"
            echo "  1. Ir a Actions → 🚗 RosarioGarage Scraper"
            echo "  2. Click 'Run workflow'"
            echo "  3. Esperar a que termine OK"
            echo "  4. Volver a ejecutar este workflow"
            echo ""
            echo "══════════════════════════════════════════════"
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ BD encontrada"
          echo "exists=true" >> $GITHUB_OUTPUT
          ls -lh rosariogarage.db
          echo ""
          echo "📊 Estado ANTES de corrección:"
          sqlite3 rosariogarage.db "SELECT COUNT(*) as 'Total:' FROM vehicles;"
          sqlite3 rosariogarage.db "SELECT COUNT(*) as 'Activos:' FROM vehicles WHERE activo = 1;"
          echo ""
          sqlite3 rosariogarage.db "
            SELECT COALESCE(norm_status, 'NULL') as status, COUNT(*) as cantidad
            FROM vehicles GROUP BY norm_status ORDER BY cantidad DESC;
          "

      - name: 📂 Verificar archivos de configuración
        run: |
          MISSING=0
          for f in "normalizer_v2.py" "db_cleaner.py" "config/normalizer_dicts.json"; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f NO ENCONTRADO"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            exit 1
          fi

      - name: 💾 Backup pre-corrección
        if: inputs.dry_run != true
        run: |
          cp rosariogarage.db rosariogarage_nofix.db
          echo "✅ Backup: rosariogarage_nofix.db"

      - name: 🧹 Ejecutar corrección de BD
        run: |
          ARGS="--db rosariogarage.db --verbose"
          
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "⚡ MODO DRY-RUN"
            ARGS="$ARGS --dry-run"
          fi
          
          if [ "${{ inputs.skip_strategy_c }}" = "true" ]; then
            ARGS="$ARGS --skip-c"
          fi
          
          if [ "${{ inputs.only_strategy_c }}" = "true" ]; then
            ARGS="$ARGS --only-c"
          fi
          
          echo "Ejecutando: python db_cleaner.py $ARGS"
          python db_cleaner.py $ARGS

      - name: 📊 Comparar ANTES vs DESPUÉS
        if: inputs.dry_run != true
        run: |
          echo "📊 Estado DESPUÉS:"
          sqlite3 rosariogarage.db "
            SELECT COALESCE(norm_status, 'NULL') as status, COUNT(*) as cantidad
            FROM vehicles GROUP BY norm_status ORDER BY cantidad DESC;
          "

      - name: 📤 Subir BD corregida (master)
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error
          overwrite: true

      - name: 📦 Subir BD para dashboard
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error
          overwrite: true

      - name: 📦 Subir backup
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-nofix-db
          path: rosariogarage_nofix.db
          retention-days: 30
          compression-level: 9

      - name: 🚀 Notificar dashboard
        if: inputs.dry_run != true && inputs.notify_dashboard == true
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          repository: Brunoact/Ros-Gar-Dash
          event-type: db-updated
          client-payload: '{"run_id": "${{ github.run_id }}", "source": "fix-db"}'

      - name: 📝 Resumen
        if: always()
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "# ⚡ DRY RUN - Sin cambios aplicados" >> $GITHUB_STEP_SUMMARY
          else
            echo "# 🧹 Corrección completada" >> $GITHUB_STEP_SUMMARY
          fi
