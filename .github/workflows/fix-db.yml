# .github/workflows/fix-db.yml
name: 🧹 Corregir Base de Datos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no aplicar cambios)'
        required: false
        type: boolean
        default: false
      notify_dashboard:
        description: 'Notificar al dashboard después de corregir'
        required: false
        type: boolean
        default: true
      skip_strategy_c:
        description: 'Saltar Estrategia C (re-matching versiones)'
        required: false
        type: boolean
        default: false
      only_strategy_c:
        description: 'Ejecutar SOLO Estrategia C'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  fix-database:
    name: 🔧 Corregir y Re-normalizar
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────────
      # Setup
      # ──────────────────────────────────────────────
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ──────────────────────────────────────────────
      # Descargar BD actual
      # ──────────────────────────────────────────────
      - name: 📥 Descargar BD maestra actual
        uses: dawidd6/action-download-artifact@v3
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success

      - name: 📋 Verificar BD descargada
        run: |
          if [ ! -f "rosariogarage.db" ]; then
            echo "❌ ERROR: No se encontró rosariogarage.db"
            exit 1
          fi
          echo "✅ BD encontrada"
          ls -lh rosariogarage.db
          echo ""
          echo "📊 Estado ANTES de corrección:"
          echo "─────────────────────────────────"
          sqlite3 rosariogarage.db "SELECT COUNT(*) as 'Total vehículos:' FROM vehicles;"
          sqlite3 rosariogarage.db "SELECT COUNT(*) as 'Activos:' FROM vehicles WHERE activo = 1;"
          echo ""
          echo "📋 norm_status actual:"
          sqlite3 rosariogarage.db "
            SELECT COALESCE(norm_status, 'NULL') as status,
                   COUNT(*) as cantidad
            FROM vehicles
            GROUP BY norm_status
            ORDER BY cantidad DESC;
          "
          echo ""
          echo "🏷️ Top 10 marcas:"
          sqlite3 rosariogarage.db "
            SELECT marca, COUNT(*) as c
            FROM vehicles
            WHERE activo = 1 AND marca IS NOT NULL
            GROUP BY marca ORDER BY c DESC LIMIT 10;
          "
          echo ""
          echo "📋 Columnas actuales:"
          sqlite3 rosariogarage.db "PRAGMA table_info(vehicles);" | while IFS='|' read num name type notnull dflt pk; do
            echo "   $name ($type)"
          done

      # ──────────────────────────────────────────────
      # Verificar archivos necesarios
      # ──────────────────────────────────────────────
      - name: 📂 Verificar archivos de configuración
        run: |
          echo "Verificando archivos necesarios..."

          if [ ! -f "normalizer_v2.py" ]; then
            echo "❌ ERROR: normalizer_v2.py no encontrado"
            exit 1
          fi
          echo "✅ normalizer_v2.py"

          if [ ! -f "db_cleaner.py" ]; then
            echo "❌ ERROR: db_cleaner.py no encontrado"
            exit 1
          fi
          echo "✅ db_cleaner.py"

          if [ ! -f "config/normalizer_dicts.json" ]; then
            echo "❌ ERROR: config/normalizer_dicts.json no encontrado"
            echo ""
            echo "Este archivo es necesario para el normalizer_v2."
            echo "Generalo con el script de generación de dicts."
            exit 1
          fi
          echo "✅ config/normalizer_dicts.json"

          echo ""
          echo "📊 Info del catálogo:"
          python3 -c "
          import json
          with open('config/normalizer_dicts.json') as f:
              d = json.load(f)
          meta = d.get('_metadata', {})
          print(f\"  Versión generador: {meta.get('generator_version', '?')}\")
          print(f\"  Marcas: {meta.get('total_brands', '?')}\")
          print(f\"  Modelos: {meta.get('total_models', '?')}\")
          print(f\"  Versiones: {meta.get('total_versions', '?')}\")
          print(f\"  Componentes: {meta.get('total_version_components', '?')}\")
          "

      # ──────────────────────────────────────────────
      # Crear backup (BD sin corregir)
      # ──────────────────────────────────────────────
      - name: 💾 Crear copia de BD sin corregir
        run: |
          cp rosariogarage.db rosariogarage_nofix.db
          echo "✅ Copia creada: rosariogarage_nofix.db"
          ls -lh rosariogarage_nofix.db

      # ──────────────────────────────────────────────
      # Ejecutar corrección
      # ──────────────────────────────────────────────
      - name: 🧹 Ejecutar corrección de BD
        run: |
          ARGS="--db rosariogarage.db --verbose"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "⚡ MODO DRY-RUN"
            ARGS="$ARGS --dry-run"
          fi

          if [ "${{ inputs.skip_strategy_c }}" = "true" ]; then
            echo "⏭️ Saltando Estrategia C"
            ARGS="$ARGS --skip-c"
          fi

          if [ "${{ inputs.only_strategy_c }}" = "true" ]; then
            echo "🎯 Solo Estrategia C"
            ARGS="$ARGS --only-c"
          fi

          echo "Ejecutando: python db_cleaner.py $ARGS"
          python db_cleaner.py $ARGS

      # ──────────────────────────────────────────────
      # Estadísticas Estrategia C
      # ──────────────────────────────────────────────
      - name: 🅲️ Estadísticas Estrategia C
        if: inputs.dry_run != true
        run: |
          echo "🅲️ Estadísticas de Re-matching de versiones:"
          echo "─────────────────────────────────────"

          # Verificar si existe la tabla changelog
          HAS_CL=$(sqlite3 rosariogarage.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='normalization_changelog';" 2>/dev/null || echo "0")

          if [ "$HAS_CL" = "0" ]; then
            echo "ℹ️ No hay tabla normalization_changelog"
          else
            TOTAL_C=$(sqlite3 rosariogarage.db "
              SELECT COUNT(*) FROM normalization_changelog
              WHERE estrategia LIKE 'C_%';
            " 2>/dev/null || echo "0")
            echo "Total cambios Estrategia C: $TOTAL_C"

            if [ "$TOTAL_C" -gt "0" ]; then
              echo ""
              echo "Detalle por tipo:"
              sqlite3 rosariogarage.db "
                SELECT estrategia, COUNT(*) as cantidad
                FROM normalization_changelog
                WHERE estrategia LIKE 'C_%'
                GROUP BY estrategia
                ORDER BY cantidad DESC;
              "

              echo ""
              echo "Últimos 10 re-matches:"
              sqlite3 rosariogarage.db "
                SELECT vehicle_id, campo, valor_anterior, valor_nuevo,
                       razon, confidence
                FROM normalization_changelog
                WHERE estrategia = 'C_version_rematch'
                  AND campo = 'version'
                ORDER BY fecha DESC
                LIMIT 10;
              "
            fi

            echo ""
            echo "Total changelog:"
            sqlite3 rosariogarage.db "
              SELECT estrategia, COUNT(*) as cantidad
              FROM normalization_changelog
              GROUP BY estrategia
              ORDER BY cantidad DESC;
            "
          fi

          echo ""
          echo "norm_status actual:"
          sqlite3 rosariogarage.db "
            SELECT COALESCE(norm_status, 'NULL') as status,
                   COUNT(*) as cantidad
            FROM vehicles
            GROUP BY norm_status
            ORDER BY cantidad DESC;
          "

          echo ""
          echo "📋 Metadata poblada (activos):"
          sqlite3 rosariogarage.db "
            SELECT
              SUM(CASE WHEN puertas IS NOT NULL THEN 1 ELSE 0 END) as con_puertas,
              SUM(CASE WHEN traccion IS NOT NULL THEN 1 ELSE 0 END) as con_traccion,
              SUM(CASE WHEN tiene_gnc = 1 THEN 1 ELSE 0 END) as con_gnc,
              SUM(CASE WHEN es_0km = 1 THEN 1 ELSE 0 END) as con_0km,
              SUM(CASE WHEN version_raw IS NOT NULL THEN 1 ELSE 0 END) as con_version_raw,
              SUM(CASE WHEN descripcion IS NOT NULL THEN 1 ELSE 0 END) as con_descripcion
            FROM vehicles WHERE activo = 1;
          "

      # ──────────────────────────────────────────────
      # Comparar antes/después
      # ──────────────────────────────────────────────
      - name: 📊 Comparar ANTES vs DESPUÉS
        if: inputs.dry_run != true
        run: |
          python3 << 'PYTHON_SCRIPT'
          import sqlite3
          import json

          def get_stats(db_path, label):
              conn = sqlite3.connect(db_path)
              stats = {}

              stats['total'] = conn.execute(
                  "SELECT COUNT(*) FROM vehicles"
              ).fetchone()[0]
              stats['activos'] = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE activo = 1"
              ).fetchone()[0]
              stats['con_marca'] = conn.execute(
                  "SELECT COUNT(*) FROM vehicles "
                  "WHERE marca IS NOT NULL AND marca != ''"
              ).fetchone()[0]
              stats['con_modelo'] = conn.execute(
                  "SELECT COUNT(*) FROM vehicles "
                  "WHERE modelo IS NOT NULL AND modelo != ''"
              ).fetchone()[0]

              # version
              try:
                  stats['con_version'] = conn.execute(
                      "SELECT COUNT(*) FROM vehicles "
                      "WHERE version IS NOT NULL AND version != ''"
                  ).fetchone()[0]
              except Exception:
                  stats['con_version'] = 0

              # norm_status
              rows = conn.execute("""
                  SELECT COALESCE(norm_status, 'NULL') as s,
                         COUNT(*) as c
                  FROM vehicles
                  GROUP BY norm_status ORDER BY c DESC
              """).fetchall()
              stats['norm_status'] = {r[0]: r[1] for r in rows}

              # metadata
              try:
                  meta = conn.execute("""
                      SELECT
                        SUM(CASE WHEN puertas IS NOT NULL THEN 1 ELSE 0 END),
                        SUM(CASE WHEN traccion IS NOT NULL THEN 1 ELSE 0 END),
                        SUM(CASE WHEN tiene_gnc = 1 THEN 1 ELSE 0 END),
                        SUM(CASE WHEN es_0km = 1 THEN 1 ELSE 0 END)
                      FROM vehicles
                  """).fetchone()
                  stats['con_puertas'] = meta[0] or 0
                  stats['con_traccion'] = meta[1] or 0
                  stats['con_gnc'] = meta[2] or 0
                  stats['con_0km'] = meta[3] or 0
              except Exception:
                  stats['con_puertas'] = 0
                  stats['con_traccion'] = 0
                  stats['con_gnc'] = 0
                  stats['con_0km'] = 0

              # changelog
              try:
                  stats['changelog'] = conn.execute(
                      "SELECT COUNT(*) FROM normalization_changelog"
                  ).fetchone()[0]
              except Exception:
                  stats['changelog'] = 0

              try:
                  rows = conn.execute("""
                      SELECT estrategia, COUNT(*) as c
                      FROM normalization_changelog
                      GROUP BY estrategia ORDER BY c DESC
                  """).fetchall()
                  stats['changes_by_type'] = {r[0]: r[1] for r in rows}
              except Exception:
                  stats['changes_by_type'] = {}

              # Estrategia C específico
              try:
                  stats['strategy_c'] = conn.execute(
                      "SELECT COUNT(*) FROM normalization_changelog "
                      "WHERE estrategia LIKE 'C_%'"
                  ).fetchone()[0]
              except Exception:
                  stats['strategy_c'] = 0

              conn.close()
              return stats

          antes = get_stats('rosariogarage_nofix.db', 'ANTES')
          despues = get_stats('rosariogarage.db', 'DESPUÉS')

          print("=" * 65)
          print("📊 COMPARACIÓN ANTES vs DESPUÉS")
          print("=" * 65)

          print(f"\n{'Métrica':<30} {'Antes':>10} {'Después':>10} {'Δ':>10}")
          print("─" * 65)

          for key, label in [
              ('total', 'Total vehículos'),
              ('activos', 'Activos'),
              ('con_marca', 'Con marca'),
              ('con_modelo', 'Con modelo'),
              ('con_version', 'Con versión'),
          ]:
              a = antes[key]
              d = despues[key]
              delta = d - a
              sign = '+' if delta > 0 else ''
              print(f"  {label:<28} {a:>10} {d:>10} {sign}{delta:>9}")

          print(f"\n📋 Metadata:")
          for key, label in [
              ('con_puertas', 'Con puertas'),
              ('con_traccion', 'Con tracción'),
              ('con_gnc', 'Con GNC'),
              ('con_0km', 'Con 0km'),
          ]:
              a = antes[key]
              d = despues[key]
              delta = d - a
              sign = '+' if delta > 0 else ''
              print(f"  {label:<28} {a:>10} {d:>10} {sign}{delta:>9}")

          print(f"\n📋 norm_status:")
          all_statuses = set(
              list(antes['norm_status'].keys()) +
              list(despues['norm_status'].keys())
          )
          for s in sorted(all_statuses):
              a = antes['norm_status'].get(s, 0)
              d = despues['norm_status'].get(s, 0)
              delta = d - a
              sign = '+' if delta > 0 else ''
              print(f"  {s:<28} {a:>10} {d:>10} {sign}{delta:>9}")

          if despues['changelog'] > 0:
              print(f"\n📝 Cambios aplicados: {despues['changelog']}")
              for tipo, count in despues['changes_by_type'].items():
                  print(f"  {tipo}: {count}")

          if despues['strategy_c'] > 0:
              print(f"\n🅲️ Estrategia C: {despues['strategy_c']} cambios")

          # Guardar para summary
          summary = {
              'antes': {k: v for k, v in antes.items()
                        if not isinstance(v, dict)},
              'despues': {k: v for k, v in despues.items()
                          if not isinstance(v, dict)},
              'antes_norm': antes['norm_status'],
              'despues_norm': despues['norm_status'],
              'cambios_totales': despues['changelog'],
              'cambios_por_tipo': despues['changes_by_type'],
              'strategy_c': despues['strategy_c'],
          }
          with open('fix_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          print("\n" + "=" * 65)
          PYTHON_SCRIPT

      # ──────────────────────────────────────────────
      # Subir artifacts
      # ──────────────────────────────────────────────
      - name: 📤 Subir BD corregida como master
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error
          overwrite: true

      - name: 📦 Subir BD corregida para dashboard
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error
          overwrite: true

      - name: 📦 Subir BD sin corregir (backup)
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-nofix-db
          path: rosariogarage_nofix.db
          retention-days: 30
          compression-level: 9

      # ──────────────────────────────────────────────
      # Notificar dashboard
      # ──────────────────────────────────────────────
      - name: 📅 Obtener fecha
        if: inputs.dry_run != true && inputs.notify_dashboard == true
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 🚀 Notificar dashboard
        if: inputs.dry_run != true && inputs.notify_dashboard == true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          repository: Brunoact/Ros-Gar-Dash
          event-type: db-updated
          client-payload: |
            {
              "run_id": "${{ github.run_id }}",
              "scrape_date": "${{ steps.date.outputs.date }}",
              "source": "fix-db"
            }

      # ──────────────────────────────────────────────
      # Resumen
      # ──────────────────────────────────────────────
      - name: 📝 Crear resumen del workflow
        if: always()
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # ⚡ Corrección de BD - DRY RUN

          Se ejecutó en modo simulación. No se aplicaron cambios.
          Ver logs del paso "🧹 Ejecutar corrección de BD" para detalles.

          ## ⚙️ Opciones utilizadas
          | Opción | Valor |
          |--------|-------|
          | Dry Run | ✅ Sí |
          | Skip Estrategia C | **${{ inputs.skip_strategy_c }}** |
          | Solo Estrategia C | **${{ inputs.only_strategy_c }}** |
          EOF
          else
            # Leer datos del summary si existe
            if [ -f fix_summary.json ]; then
              CAMBIOS=$(jq -r '.cambios_totales // 0' fix_summary.json)
              STRATEGY_C=$(jq -r '.strategy_c // 0' fix_summary.json)
              ANTES_FULL=$(jq -r '.antes_norm.full_match // 0' fix_summary.json)
              DESPUES_FULL=$(jq -r '.despues_norm.full_match // 0' fix_summary.json)
              ANTES_PARTIAL=$(jq -r '.antes_norm.partial_match // 0' fix_summary.json)
              DESPUES_PARTIAL=$(jq -r '.despues_norm.partial_match // 0' fix_summary.json)
              DELTA_FULL=$((DESPUES_FULL - ANTES_FULL))
              DELTA_PARTIAL=$((DESPUES_PARTIAL - ANTES_PARTIAL))
            else
              CAMBIOS="?"
              STRATEGY_C="?"
              ANTES_FULL="?"; DESPUES_FULL="?"; DELTA_FULL="?"
              ANTES_PARTIAL="?"; DESPUES_PARTIAL="?"; DELTA_PARTIAL="?"
            fi

            cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🧹 Corrección de BD Completada

          **Fecha:** $(date +'%Y-%m-%d %H:%M:%S UTC')

          ## ⚙️ Opciones utilizadas
          | Opción | Valor |
          |--------|-------|
          | Dry Run | ❌ No |
          | Skip Estrategia C | **${{ inputs.skip_strategy_c }}** |
          | Solo Estrategia C | **${{ inputs.only_strategy_c }}** |

          ## 📊 Resultados

          | Métrica | Valor |
          |---------|-------|
          | 📝 Total cambios aplicados | **${CAMBIOS}** |
          | 🅲️ Cambios Estrategia C | **${STRATEGY_C}** |

          ## 🔧 Normalización

          | Estado | Antes | Después | Δ |
          |--------|-------|---------|---|
          | ✅ full_match | ${ANTES_FULL} | ${DESPUES_FULL} | **+${DELTA_FULL}** |
          | 🟡 partial_match | ${ANTES_PARTIAL} | ${DESPUES_PARTIAL} | **${DELTA_PARTIAL}** |

          Ver logs del paso "📊 Comparar ANTES vs DESPUÉS" para el detalle completo.

          ## 📥 Artifacts

          | Artifact | Descripción |
          |----------|-------------|
          | \`rosariogarage-master-db\` | BD corregida (uso interno) |
          | \`rosariogarage-db\` | BD corregida (dashboard) |
          | \`rosariogarage-nofix-db\` | BD original sin corregir (backup 30 días) |
          EOF
          fi
