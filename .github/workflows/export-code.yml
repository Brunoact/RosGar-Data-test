# .github/export-code.yml
name: 📦 Export Repo Code to TXT

on:
  workflow_dispatch:  # Botón manual en GitHub Actions
    inputs:
      include_json:
        description: 'Incluir archivos .json'
        required: false
        default: 'true'
        type: boolean
      max_file_size_kb:
        description: 'Tamaño máximo por archivo (KB)'
        required: false
        default: '5000'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate export
        run: |
          #!/bin/bash
          set -euo pipefail

          REPO_NAME="${{ github.repository }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          OUTPUT="repo_export_${SHORT_SHA}.txt"
          MAX_SIZE_KB="${{ inputs.max_file_size_kb || '500' }}"
          MAX_SIZE_BYTES=$((MAX_SIZE_KB * 1024))
          INCLUDE_JSON="${{ inputs.include_json || 'true' }}"
          
          # Extensiones
          EXTS="py|js|jsx|ts|tsx|css|scss|html|sh|bash|sql|md|yml|yaml|toml|cfg|ini"
          if [ "$INCLUDE_JSON" = "true" ]; then
            EXTS="${EXTS}|json"
          fi
          
          # Directorios a excluir
          EXCLUDE_PATTERN="node_modules|\.git/|__pycache__|dist/|build/|\.next|venv|\.venv"
          EXCLUDE_FILES="package-lock\.json|yarn\.lock|pnpm-lock\.yaml"
          
          SEP="$(printf '═%.0s' {1..70})"
          LINE="$(printf '─%.0s' {1..50})"
          
          # Header
          {
            echo "$SEP"
            echo "  EXPORT COMPLETO: $REPO_NAME"
            echo "  Branch: $BRANCH"
            echo "  Commit: $SHORT_SHA"
            echo "  Fecha: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Generado por: GitHub Actions"
            echo "$SEP"
            echo ""
          } > "$OUTPUT"
          
          # Recopilar archivos
          FILES=$(find . -type f \
            | grep -Ev "($EXCLUDE_PATTERN)" \
            | grep -Ev "($EXCLUDE_FILES)" \
            | grep -E "\.($EXTS)$" \
            | sort)
          
          # Agregar archivos sin extensión pero importantes
          for special in Dockerfile Makefile Procfile .gitignore .dockerignore; do
            if [ -f "./$special" ]; then
              FILES="$FILES
          ./$special"
            fi
          done
          
          FILES=$(echo "$FILES" | sort -u)
          TOTAL=$(echo "$FILES" | grep -c '.' || true)
          
          # Árbol de archivos
          {
            echo "📁 ESTRUCTURA ($TOTAL archivos):"
            echo "$LINE"
            echo "$FILES" | sed 's|^\./|  |'
            echo ""
            echo "$SEP"
            echo ""
          } >> "$OUTPUT"
          
          # Contenido
          EXPORTED=0
          SKIPPED=0
          
          while IFS= read -r filepath; do
            [ -z "$filepath" ] && continue
            clean="${filepath#./}"
            
            # Verificar tamaño
            file_size=$(stat -f%z "$filepath" 2>/dev/null || stat -c%s "$filepath" 2>/dev/null || echo 0)
            
            {
              echo ""
              echo "${REPO_NAME#*/}/${clean}:"
              echo "$LINE"
            } >> "$OUTPUT"
            
            if [ "$file_size" -gt "$MAX_SIZE_BYTES" ]; then
              echo "[OMITIDO - Archivo muy grande: $((file_size / 1024))KB (máx: ${MAX_SIZE_KB}KB)]" >> "$OUTPUT"
              SKIPPED=$((SKIPPED + 1))
            else
              cat "$filepath" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              EXPORTED=$((EXPORTED + 1))
            fi
          done <<< "$FILES"
          
          # Footer
          {
            echo ""
            echo "$SEP"
            echo "  FIN - Exportados: $EXPORTED | Omitidos: $SKIPPED"
            echo "$SEP"
          } >> "$OUTPUT"
          
          echo "output_file=$OUTPUT" >> "$GITHUB_ENV"
          echo "exported_count=$EXPORTED" >> "$GITHUB_ENV"
          
          FILE_SIZE=$(du -h "$OUTPUT" | cut -f1)
          echo "✅ Export generado: $OUTPUT ($FILE_SIZE, $EXPORTED archivos)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-export
          path: ${{ env.output_file }}
          retention-days: 1

      - name: Summary
        run: |
          echo "## 📦 Export generado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** \`${{ env.output_file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivos exportados:** ${{ env.exported_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descargá el artifact desde la sección **Artifacts** de este run." >> $GITHUB_STEP_SUMMARY
          echo "- **Archivos exportados:** ${{ env.exported_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descargá el artifact desde la sección **Artifacts** de este run." >> $GITHUB_STEP_SUMMARY
