name: 💾 Backup Mensual

on:
  schedule:
    # Día 1 de cada mes a las 12:00 UTC
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  backup:
    name: 📦 Crear Backup en Release
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar última BD consolidada
        uses: dawidd6/action-download-artifact@v3
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success
      
      - name: 📅 Obtener fecha
        id: date
        run: |
          echo "month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT
          echo "full=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: 📊 Generar info del backup
        id: info
        run: |
          python3 << 'EOF'
          import sqlite3
          import os
          
          conn = sqlite3.connect('rosariogarage.db')
          total = conn.execute("SELECT COUNT(*) FROM vehicles").fetchone()[0]
          activos = conn.execute("SELECT COUNT(*) FROM vehicles WHERE activo = 1").fetchone()[0]
          history = conn.execute("SELECT COUNT(*) FROM price_history").fetchone()[0]
          size_bytes = os.path.getsize('rosariogarage.db')
          size_mb = size_bytes / 1024 / 1024
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"total_vehicles={total}\n")
              f.write(f"active_vehicles={activos}\n")
              f.write(f"history_records={history}\n")
              f.write(f"size_mb={size_mb:.2f}\n")
          
          conn.close()
          EOF
      
      - name: 🗜️ Comprimir BD si es grande
        id: compress
        run: |
          SIZE_MB=$(du -m rosariogarage.db | cut -f1)
          if [ $SIZE_MB -gt 50 ]; then
            echo "💾 BD grande ($SIZE_MB MB), comprimiendo..."
            gzip -9 rosariogarage.db
            echo "compressed=true" >> $GITHUB_OUTPUT
            echo "filename=rosariogarage.db.gz" >> $GITHUB_OUTPUT
          else
            echo "📦 BD pequeña ($SIZE_MB MB), sin comprimir"
            echo "compressed=false" >> $GITHUB_OUTPUT
            echo "filename=rosariogarage.db" >> $GITHUB_OUTPUT
          fi
      
      - name: 📦 Crear Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: backup-${{ steps.date.outputs.month }}
          name: "💾 Backup ${{ steps.date.outputs.month }}"
          body: |
            ## 📦 Backup Mensual Automático
            
            **📅 Fecha:** ${{ steps.date.outputs.full }}
            
            ### 📊 Estadísticas
            - 🚗 **Vehículos totales:** ${{ steps.info.outputs.total_vehicles }}
            - ✅ **Activos:** ${{ steps.info.outputs.active_vehicles }}
            - 📈 **Registros historial:** ${{ steps.info.outputs.history_records }}
            - 💾 **Tamaño:** ${{ steps.info.outputs.size_mb }} MB
            
            ### 📥 Uso
            ```bash
            gh release download backup-${{ steps.date.outputs.month }} -p "rosariogarage.db*"
            gunzip rosariogarage.db.gz  # Si está comprimido
            sqlite3 rosariogarage.db "SELECT COUNT(*) FROM vehicles WHERE activo = 1;"
            ```
          files: ${{ steps.compress.outputs.filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
