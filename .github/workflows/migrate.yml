# .github/workflows/migrate.yml
name: 🔄 Migrar Datos Existentes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no aplicar cambios)'
        required: false
        type: boolean
        default: false
      notify_dashboard:
        description: 'Notificar al dashboard'
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  migrate:
    name: 🔄 Migrar y Re-normalizar
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ═══ FIX CRÍTICO: @v3 → @v6 ═══
      - name: 📥 Descargar BD maestra actual
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success
          if_no_artifact_found: warn
          search_artifacts: true
          allow_forks: false

      - name: 📋 Verificar BD
        run: |
          if [ ! -f "rosariogarage.db" ]; then
            echo "❌ BD no encontrada. Ejecutá el scraper primero."
            exit 1
          fi
          echo "✅ BD encontrada"
          ls -lh rosariogarage.db
          sqlite3 rosariogarage.db "SELECT COUNT(*) as 'Vehículos:' FROM vehicles;"

      - name: 📂 Verificar archivos
        run: |
          for f in "migrate_old_data.py" "normalizer_v2.py" "config/normalizer_dicts.json"; do
            if [ ! -f "$f" ]; then
              echo "❌ Falta: $f"
              exit 1
            fi
            echo "✅ $f"
          done

      - name: 💾 Backup pre-migración
        run: |
          cp rosariogarage.db rosariogarage_pre_migration.db
          echo "✅ Backup creado"

      - name: 🔄 Ejecutar migración
        run: |
          ARGS="--db rosariogarage.db --verbose"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python migrate_old_data.py $ARGS

      - name: 📊 Verificar resultado
        if: inputs.dry_run != true
        run: |
          sqlite3 rosariogarage.db "
            SELECT COALESCE(norm_status, 'NULL') as status, COUNT(*) as cantidad
            FROM vehicles GROUP BY norm_status ORDER BY cantidad DESC;
          "

      - name: 📤 Subir BD migrada (master)
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          overwrite: true

      - name: 📦 Subir BD para dashboard
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          overwrite: true

      - name: 📦 Subir backup
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-pre-migration-db
          path: rosariogarage_pre_migration.db
          retention-days: 30

      - name: 🚀 Notificar dashboard
        if: inputs.dry_run != true && inputs.notify_dashboard == true
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          repository: Brunoact/Ros-Gar-Dash
          event-type: db-updated
          client-payload: '{"run_id": "${{ github.run_id }}", "source": "migration"}'
