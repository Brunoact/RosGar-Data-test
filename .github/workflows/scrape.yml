name: 🚗 RosarioGarage Scraper

on:
  schedule:
    # Ejecutar diariamente a las 6:00 UTC (3:00 AM Argentina)
    - cron: '0 6 * * *'
  
  workflow_dispatch:
    inputs:
      debug:
        description: 'Modo debug (más logs)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  TOTAL_WORKERS: 8

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1: Scraping distribuido en 8 workers
  # ══════════════════════════════════════════════════════════════
  scrape:
    name: 🔹 Worker ${{ matrix.worker_id }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false  # No cancelar todos si uno falla
      max-parallel: 8
      matrix:
        worker_id: [0, 1, 2, 3, 4, 5, 6, 7]
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install httpx[http2] beautifulsoup4 lxml aiosqlite

      - name: 🚀 Ejecutar Worker ${{ matrix.worker_id }}
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 30

      - name: 📊 Info de la BD del worker
        if: success()
        run: |
          if [ -f rosariogarage_worker_${{ matrix.worker_id }}.db ]; then
            ls -lh rosariogarage_worker_${{ matrix.worker_id }}.db
            echo "Tamaño: $(du -h rosariogarage_worker_${{ matrix.worker_id }}.db | cut -f1)"
            sqlite3 rosariogarage_worker_${{ matrix.worker_id }}.db "SELECT COUNT(*) as total FROM vehicles;" | xargs -I {} echo "Vehículos en worker ${{ matrix.worker_id }}: {}"
          else
            echo "⚠️ No se generó archivo de base de datos"
          fi

      - name: 📤 Subir BD parcial como artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker_id }}-db
          path: rosariogarage_worker_${{ matrix.worker_id }}.db
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════
  # JOB 2: Consolidar resultados de todos los workers
  # ══════════════════════════════════════════════════════════════
  consolidate:
    name: 📊 Consolidar Resultados
    runs-on: ubuntu-latest
    needs: scrape
    if: always() && contains(needs.scrape.result, 'success')  # Solo si al menos un worker tuvo éxito
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install httpx beautifulsoup4 lxml aiosqlite

      - name: 📥 Descargar BD maestra anterior (si existe)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rosariogarage-master-db
          path: .

      - name: 📥 Descargar todas las BDs de workers
        uses: actions/download-artifact@v4
        with:
          pattern: worker-*-db
          path: .
          merge-multiple: true

      - name: 📋 Verificar archivos descargados
        run: |
          echo "=== Archivos .db encontrados ==="
          ls -lh *.db 2>/dev/null || echo "⚠️ No se encontraron archivos .db"
          echo ""
          echo "=== Verificación de workers ==="
          for i in {0..7}; do
            if [ -f "rosariogarage_worker_${i}.db" ]; then
              echo "✅ Worker ${i}: $(du -h rosariogarage_worker_${i}.db | cut -f1)"
            else
              echo "⚠️ Worker ${i}: No encontrado"
            fi
          done

      - name: 🔄 Consolidar todas las BDs
        env:
          CONSOLIDATE_MODE: 'true'
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 10

      - name: 📊 Generar estadísticas detalladas
        if: success()
        run: |
          python3 << 'PYTHON_SCRIPT'
          import sqlite3
          from datetime import date, datetime
          import json
          
          def format_number(n):
              return f"{n:,}".replace(",", ".")
          
          try:
              conn = sqlite3.connect('rosariogarage.db')
              
              print("=" * 60)
              print("📊 RESUMEN DEL SCRAPING - ROSARIOGARAGE")
              print("=" * 60)
              print(f"📅 Fecha: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}")
              print()
              
              # Vehículos
              total = conn.execute("SELECT COUNT(*) FROM vehicles").fetchone()[0]
              activos = conn.execute("SELECT COUNT(*) FROM vehicles WHERE activo = 1").fetchone()[0]
              inactivos = conn.execute("SELECT COUNT(*) FROM vehicles WHERE activo = 0").fetchone()[0]
              
              print(f"🚗 VEHÍCULOS")
              print(f"   Total en BD:     {format_number(total)}")
              print(f"   ├─ Activos:      {format_number(activos)}")
              print(f"   └─ Inactivos:    {format_number(inactivos)}")
              print()
              
              # Nuevos y cambios hoy
              today = date.today().isoformat()
              nuevos_hoy = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE primera_vista = ?", (today,)
              ).fetchone()[0]
              
              cambios_precio_hoy = conn.execute(
                  "SELECT COUNT(*) FROM price_history WHERE fecha = ?", (today,)
              ).fetchone()[0]
              
              actualizados_hoy = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE ultima_vista = ? AND primera_vista != ?", 
                  (today, today)
              ).fetchone()[0]
              
              inactivos_hoy = conn.execute(
                  """SELECT COUNT(*) FROM vehicles 
                     WHERE activo = 0 
                     AND ultima_vista < date('now')
                     AND ultima_vista >= date('now', '-2 days')"""
              ).fetchone()[0]
              
              print(f"📈 CAMBIOS HOY")
              print(f"   Nuevos:          {format_number(nuevos_hoy)}")
              print(f"   Actualizados:    {format_number(actualizados_hoy)}")
              print(f"   Cambios precio:  {format_number(cambios_precio_hoy)}")
              print(f"   Vendidos/Inact:  {format_number(inactivos_hoy)}")
              print()
              
              # Rango de precios (activos)
              precio_stats = conn.execute("""
                  SELECT 
                      MIN(precio_usd) as min_precio,
                      MAX(precio_usd) as max_precio,
                      AVG(precio_usd) as avg_precio,
                      COUNT(*) as count
                  FROM vehicles 
                  WHERE activo = 1 
                  AND precio_usd IS NOT NULL 
                  AND precio_usd > 0
              """).fetchone()
              
              if precio_stats[3] > 0:
                  print(f"💰 RANGO DE PRECIOS (USD)")
                  print(f"   Mínimo:          ${format_number(int(precio_stats[0]))}")
                  print(f"   Máximo:          ${format_number(int(precio_stats[1]))}")
                  print(f"   Promedio:        ${format_number(int(precio_stats[2]))}")
                  print()
              
              # Top marcas
              print(f"🏭 TOP 10 MARCAS (Activos)")
              for marca, count in conn.execute("""
                  SELECT marca, COUNT(*) as c 
                  FROM vehicles 
                  WHERE activo = 1 AND marca IS NOT NULL AND marca != 'N/A'
                  GROUP BY marca 
                  ORDER BY c DESC 
                  LIMIT 10
              """):
                  bar = '█' * min(30, int(count * 30 / activos))
                  print(f"   {marca:15s} {count:5} {bar}")
              print()
              
              # Top modelos más ofrecidos
              print(f"🚙 TOP 5 MODELOS MÁS OFRECIDOS")
              for modelo, marca, count in conn.execute("""
                  SELECT modelo, marca, COUNT(*) as c 
                  FROM vehicles 
                  WHERE activo = 1 
                  AND modelo IS NOT NULL 
                  AND modelo != 'N/A'
                  AND marca IS NOT NULL
                  AND marca != 'N/A'
                  GROUP BY marca, modelo 
                  ORDER BY c DESC 
                  LIMIT 5
              """):
                  print(f"   {marca} {modelo[:30]:30s} {count:4}")
              print()
              
              # Metadata
              metadata = {}
              for key, value in conn.execute("SELECT key, value FROM scrape_metadata"):
                  metadata[key] = value
              
              if 'last_dolar_mep' in metadata:
                  print(f"💵 Dólar MEP: ${float(metadata['last_dolar_mep']):.2f}")
              
              if 'rate_limits_429' in metadata and int(metadata.get('rate_limits_429', 0)) > 0:
                  print(f"⚠️ Rate limits detectados: {metadata['rate_limits_429']}")
              
              # Historial total
              total_history = conn.execute("SELECT COUNT(*) FROM price_history").fetchone()[0]
              print(f"📜 Registros de historial: {format_number(total_history)}")
              
              # Estadísticas de días publicado
              avg_dias = conn.execute("""
                  SELECT AVG(dias_publicado) 
                  FROM vehicles 
                  WHERE activo = 1 AND dias_publicado > 0
              """).fetchone()[0]
              
              if avg_dias:
                  print(f"📅 Promedio días publicado: {int(avg_dias)} días")
              
              print("=" * 60)
              
              # Generar JSON para GitHub Summary
              summary_data = {
                  "total": total,
                  "activos": activos,
                  "nuevos_hoy": nuevos_hoy,
                  "cambios_precio": cambios_precio_hoy,
                  "dolar_mep": float(metadata.get('last_dolar_mep', 0))
              }
              
              with open("summary.json", "w") as f:
                  json.dump(summary_data, f)
              
              conn.close()
              
          except Exception as e:
              print(f"❌ Error generando estadísticas: {e}")
              import traceback
              traceback.print_exc()
          PYTHON_SCRIPT

      - name: 📊 Análisis de tamaño y optimización
        run: |
          SIZE_MB=$(du -m rosariogarage.db | cut -f1)
          SIZE_HR=$(du -h rosariogarage.db | cut -f1)
          
          echo "💾 Tamaño de la base de datos: $SIZE_HR"
          
          if [ $SIZE_MB -gt 100 ]; then
            echo "⚠️ ADVERTENCIA: La BD supera 100 MB"
            echo "   Ejecutando VACUUM para optimizar..."
            sqlite3 rosariogarage.db "VACUUM;"
            NEW_SIZE=$(du -h rosariogarage.db | cut -f1)
            echo "   Nuevo tamaño: $NEW_SIZE"
          fi

      - name: 📤 Subir BD consolidada
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error

      - name: 📝 Crear resumen del workflow
        if: success()
        run: |
          if [ -f summary.json ]; then
            NUEVOS=$(jq -r '.nuevos_hoy' summary.json)
            ACTIVOS=$(jq -r '.activos' summary.json)
            CAMBIOS=$(jq -r '.cambios_precio' summary.json)
            DOLAR=$(jq -r '.dolar_mep' summary.json)
          else
            NUEVOS="N/A"
            ACTIVOS="N/A"
            CAMBIOS="N/A"
            DOLAR="N/A"
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ✅ Scraping RosarioGarage Completado
          
          **Fecha:** $(date +'%Y-%m-%d %H:%M:%S UTC')
          
          ## 📊 Resumen
          
          | Métrica | Valor |
          |---------|-------|
          | 🚗 Vehículos activos | **${ACTIVOS}** |
          | 🆕 Nuevos hoy | **${NUEVOS}** |
          | 💰 Cambios de precio | **${CAMBIOS}** |
          | 💵 Dólar MEP | **\$${DOLAR}** |
          
          ## 📥 Descarga
          
          La base de datos completa está disponible en los **Artifacts** del workflow (retención: 90 días)
          
          ---
          
          *Ver logs del paso "Generar estadísticas detalladas" para más información*
          EOF

  # ══════════════════════════════════════════════════════════════
  # JOB 3: Limpieza de artifacts antiguos (opcional)
  # ══════════════════════════════════════════════════════════════
  cleanup:
    name: 🧹 Limpieza
    runs-on: ubuntu-latest
    needs: consolidate
    if: always()
    
    steps:
      - name: 🗑️ Eliminar artifacts de workers
        uses: geekyeggo/delete-artifact@v4
        with:
          name: worker-*-db
          failOnError: false

  # ══════════════════════════════════════════════════════════════
  # JOB 4: Notificación en caso de error
  # ══════════════════════════════════════════════════════════════
  notify-failure:
    name: 🚨 Notificar Fallo
    runs-on: ubuntu-latest
    needs: [scrape, consolidate]
    if: failure()
    
    steps:
      - name: 📝 Registrar fallo en summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ❌ Scraping Fallido
          
          **Fecha:** $(date +'%Y-%m-%d %H:%M:%S UTC')
          
          El proceso de scraping ha fallado. Se reintentará automáticamente mañana.
          
          ## 🔍 Pasos para diagnosticar:
          
          1. Revisar los logs de los workers que fallaron
          2. Verificar si hubo cambios en el sitio web
          3. Comprobar límites de rate limiting
          4. Validar conectividad de red
          
          ---
          
          *El workflow se ejecutará nuevamente según el schedule programado*
          EOF
