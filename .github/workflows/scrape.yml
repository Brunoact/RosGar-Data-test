# .github/workflows/scrape.yml
name: 🚗 RosarioGarage Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Modo debug (más logs)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  TOTAL_WORKERS: 8

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1: Scraping distribuido en 8 workers
  # ══════════════════════════════════════════════════════════════
  scrape:
    name: 🔹 Worker ${{ matrix.worker_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        worker_id: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar Worker ${{ matrix.worker_id }}
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 30

      - name: 📊 Info de la BD del worker
        if: always()
        run: |
          DB_FILE="rosariogarage_worker_${{ matrix.worker_id }}.db"
          if [ -f "$DB_FILE" ]; then
            echo "✅ Archivo encontrado: $DB_FILE"
            ls -lh "$DB_FILE"
            echo ""
            echo "📊 Estadísticas:"
            sqlite3 "$DB_FILE" "SELECT COUNT(*) as 'Vehículos en worker ${{ matrix.worker_id }}:' FROM vehicles;" 2>/dev/null || echo "⚠️ Sin datos"
            sqlite3 "$DB_FILE" "SELECT key, value FROM scrape_metadata;" 2>/dev/null || true
          else
            echo "❌ ERROR: No se generó $DB_FILE"
            echo "Archivos en directorio:"
            ls -la
            exit 1
          fi

      - name: 📤 Subir BD del worker
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker_id }}-db
          path: rosariogarage_worker_${{ matrix.worker_id }}.db
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════
  # JOB 2: Consolidar resultados de todos los workers
  # ══════════════════════════════════════════════════════════════
  consolidate:
    name: 📊 Consolidar Resultados
    runs-on: ubuntu-latest
    needs: scrape
    if: always() && !cancelled() && needs.scrape.result != 'failure'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ═══ FIX: @v3 → @v6 + if_no_artifact_found: ignore ═══
      - name: 📥 Descargar BD maestra anterior (si existe)
        id: download-master
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
          search_artifacts: true
          allow_forks: false

      - name: 📋 Verificar BD maestra anterior
        run: |
          if [ -f "rosariogarage.db" ]; then
            echo "✅ BD maestra anterior encontrada"
            ls -lh rosariogarage.db
            sqlite3 rosariogarage.db "SELECT COUNT(*) as 'Vehículos existentes:' FROM vehicles;" 2>/dev/null || true
          else
            echo "ℹ️ No existe BD maestra anterior (primera ejecución)"
            echo "   Se creará una nueva BD desde cero"
          fi

      - name: 📁 Crear directorio para workers
        run: mkdir -p ./worker_downloads

      - name: 📥 Descargar BDs de todos los workers
        uses: actions/download-artifact@v4
        with:
          pattern: worker-*-db
          path: ./worker_downloads/
          merge-multiple: false

      - name: 📋 Organizar archivos de workers
        run: |
          echo "=== Moviendo archivos al directorio raíz ==="
          
          find ./worker_downloads -type f -name "*.db" | while read f; do
            echo "  Moviendo: $f"
            mv "$f" .
          done
          
          echo ""
          echo "=== Verificación detallada ==="
          FOUND=0
          TOTAL_VEHICLES=0
          for i in {0..7}; do
            DB_FILE="rosariogarage_worker_${i}.db"
            if [ -f "$DB_FILE" ]; then
              COUNT=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM vehicles;" 2>/dev/null || echo "0")
              echo "✅ Worker ${i}: ${COUNT} vehículos"
              FOUND=$((FOUND + 1))
              TOTAL_VEHICLES=$((TOTAL_VEHICLES + COUNT))
            else
              echo "❌ Worker ${i}: NO ENCONTRADO"
            fi
          done
          
          echo ""
          echo "═══════���════════════════════════════════"
          echo "📊 Workers: ${FOUND}/8 | Vehículos: ${TOTAL_VEHICLES}"
          echo "════════════════════════════════════════"
          
          if [ $FOUND -eq 0 ]; then
            echo "❌ ERROR CRÍTICO: Ningún worker disponible"
            exit 1
          fi

      - name: 🔄 Ejecutar consolidación
        env:
          CONSOLIDATE_MODE: 'true'
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 15

      - name: 📊 Generar estadísticas
        if: success()
        run: |
          python3 << 'PYTHON_SCRIPT'
          import sqlite3
          from datetime import date, datetime
          import json

          def fmt(n):
              return f"{n:,}".replace(",", ".")

          try:
              conn = sqlite3.connect('rosariogarage.db')
              print("=" * 60)
              print("📊 RESUMEN DEL SCRAPING")
              print("=" * 60)

              total = conn.execute("SELECT COUNT(*) FROM vehicles").fetchone()[0]
              activos = conn.execute("SELECT COUNT(*) FROM vehicles WHERE activo = 1").fetchone()[0]
              print(f"🚗 Total: {fmt(total)} | Activos: {fmt(activos)}")

              normalizados = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE norm_status = 'full_match' AND activo = 1"
              ).fetchone()[0]
              parciales = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE norm_status = 'partial_match' AND activo = 1"
              ).fetchone()[0]
              print(f"🔧 Full: {fmt(normalizados)} | Parcial: {fmt(parciales)}")

              # Metadata
              meta_stats = [0]*6
              try:
                  meta_stats = conn.execute("""
                      SELECT
                          SUM(CASE WHEN puertas IS NOT NULL THEN 1 ELSE 0 END),
                          SUM(CASE WHEN traccion IS NOT NULL THEN 1 ELSE 0 END),
                          SUM(CASE WHEN tiene_gnc = 1 THEN 1 ELSE 0 END),
                          SUM(CASE WHEN es_0km = 1 THEN 1 ELSE 0 END),
                          SUM(CASE WHEN version_raw IS NOT NULL THEN 1 ELSE 0 END),
                          SUM(CASE WHEN descripcion IS NOT NULL THEN 1 ELSE 0 END)
                      FROM vehicles WHERE activo = 1
                  """).fetchone()
              except Exception:
                  pass

              today = date.today().isoformat()
              nuevos = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE primera_vista = ?", (today,)
              ).fetchone()[0]
              cambios = conn.execute(
                  "SELECT COUNT(*) FROM price_history WHERE fecha = ?", (today,)
              ).fetchone()[0]
              print(f"📈 Nuevos hoy: {fmt(nuevos)} | Cambios precio: {fmt(cambios)}")

              metadata = {}
              for key, value in conn.execute("SELECT key, value FROM scrape_metadata"):
                  metadata[key] = value

              summary = {
                  "total": total, "activos": activos,
                  "nuevos_hoy": nuevos, "cambios_precio": cambios,
                  "normalizados": normalizados, "parciales": parciales,
                  "dolar_mep": float(metadata.get('last_dolar_mep', 0)),
                  "workers": int(metadata.get('workers_consolidated', 0)),
                  "con_puertas": int(meta_stats[0] or 0),
                  "con_traccion": int(meta_stats[1] or 0),
                  "con_gnc": int(meta_stats[2] or 0),
                  "con_0km": int(meta_stats[3] or 0),
              }
              with open("summary.json", "w") as f:
                  json.dump(summary, f)

              conn.close()
              print("=" * 60)
          except Exception as e:
              print(f"❌ Error: {e}")
              import traceback; traceback.print_exc()
              exit(1)
          PYTHON_SCRIPT

      - name: 💾 Optimizar base de datos
        run: |
          SIZE_MB=$(du -m rosariogarage.db | cut -f1)
          echo "💾 Tamaño: $(du -h rosariogarage.db | cut -f1)"
          if [ $SIZE_MB -gt 50 ]; then
            sqlite3 rosariogarage.db "VACUUM;"
            echo "✅ Optimizada: $(du -h rosariogarage.db | cut -f1)"
          fi

      - name: 📤 Subir BD consolidada (master)
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error

      - name: 📦 Subir BD para dashboard
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error

      - name: 🚀 Notificar dashboard
        if: success()
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          repository: Brunoact/Ros-Gar-Dash
          event-type: db-updated
          client-payload: '{"run_id": "${{ github.run_id }}", "scrape_date": "${{ github.event.repository.updated_at }}"}'

      - name: 📝 Resumen
        if: always()
        run: |
          if [ -f summary.json ]; then
            ACTIVOS=$(jq -r '.activos // "?"' summary.json)
            NUEVOS=$(jq -r '.nuevos_hoy // "?"' summary.json)
            NORMALIZADOS=$(jq -r '.normalizados // "?"' summary.json)
            PARCIALES=$(jq -r '.parciales // "?"' summary.json)
          else
            ACTIVOS="?"; NUEVOS="?"; NORMALIZADOS="?"; PARCIALES="?"
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ✅ Scraping Completado
          | Métrica | Valor |
          |---------|-------|
          | Activos | **${ACTIVOS}** |
          | Nuevos hoy | **${NUEVOS}** |
          | Full match | **${NORMALIZADOS}** |
          | Parcial | **${PARCIALES}** |
          EOF

  # ══════════════════════════════════════════════════════════════
  cleanup:
    name: 🧹 Limpieza
    runs-on: ubuntu-latest
    needs: consolidate
    if: always()
    steps:
      - name: 🗑️ Eliminar artifacts de workers
        uses: geekyeggo/delete-artifact@v4
        with:
          name: worker-*-db
          failOnError: false
