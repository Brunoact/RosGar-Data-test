name: 🚗 RosarioGarage Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Modo debug (más logs)'
        required: false
        type: boolean
        default: false

concurrency:
  group: rosariogarage-scraper
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  PYTHON_VERSION: '3.11'
  TOTAL_WORKERS: 8

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1: Scraping distribuido en 8 workers
  # ════════════════════════════════════════════════════════════
  scrape:
    name: 🔹 Worker ${{ matrix.worker_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        worker_id: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar Worker ${{ matrix.worker_id }}
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 30

      - name: 📊 Info de la BD del worker
        if: always()
        run: |
          DB_FILE="rosariogarage_worker_${{ matrix.worker_id }}.db"
          if [ -f "$DB_FILE" ]; then
            echo "✅ Archivo encontrado: $DB_FILE"
            ls -lh "$DB_FILE"
            sqlite3 "$DB_FILE" \
              "SELECT COUNT(*) as 'Vehículos:' FROM vehicles;" \
              2>/dev/null || echo "⚠️ Sin datos"
          else
            echo "❌ ERROR: No se generó $DB_FILE"
            ls -la
            exit 1
          fi

      - name: 📤 Subir BD del worker
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker_id }}-db
          path: rosariogarage_worker_${{ matrix.worker_id }}.db
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════
  # JOB 2: Consolidar resultados de todos los workers
  # ════════════════════════════════════════════════════════════
  consolidate:
    name: 📊 Consolidar Resultados
    runs-on: ubuntu-latest
    needs: scrape
    if: always() && !cancelled() && needs.scrape.result != 'failure'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Descargar BD maestra (cualquier workflow)
        # ──────────────────────────────────────────────────────
        # Usa gh api para buscar el artifact más reciente con
        # el nombre "rosariogarage-master-db" en CUALQUIER
        # workflow del repo, ordenado por fecha de creación
        # descendente. Descarga el primero no expirado.
        # Esto resuelve el problema de dawidd6 que filtra
        # por workflow ID aunque no se especifique workflow:.
        # ──────────────────────────────────────────────────────
        run: |
          echo "🔍 Buscando artifact rosariogarage-master-db..."

          # Obtener el artifact más reciente no expirado
          ARTIFACT_INFO=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=rosariogarage-master-db&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0]' \
            2>/dev/null || echo "null")

          if [ "$ARTIFACT_INFO" = "null" ] || [ -z "$ARTIFACT_INFO" ]; then
            echo "⚠️ No se encontró artifact rosariogarage-master-db"
            echo "MASTER_DB_MISSING=true" >> $GITHUB_ENV
            exit 0
          fi

          ARTIFACT_ID=$(echo "$ARTIFACT_INFO" | jq -r '.id')
          ARTIFACT_SIZE=$(echo "$ARTIFACT_INFO" | jq -r '.size_in_bytes')
          ARTIFACT_DATE=$(echo "$ARTIFACT_INFO" | jq -r '.created_at')
          WORKFLOW_ID=$(echo "$ARTIFACT_INFO" | jq -r '.workflow_run.id')

          echo "✅ Artifact encontrado:"
          echo "   ID:       $ARTIFACT_ID"
          echo "   Tamaño:   $(echo "scale=2; $ARTIFACT_SIZE/1048576" | bc) MB"
          echo "   Creado:   $ARTIFACT_DATE"
          echo "   Run ID:   $WORKFLOW_ID"

          # Descargar usando la URL de descarga de la API
          DOWNLOAD_URL=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            --include 2>/dev/null | grep -i "^location:" | tr -d '\r' | awk '{print $2}')

          if [ -z "$DOWNLOAD_URL" ]; then
            # Alternativa: usar gh run download
            echo "  Intentando descarga alternativa..."
            gh api \
              "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              > rosariogarage-master-db.zip 2>/dev/null || true
          else
            curl -sL "$DOWNLOAD_URL" -o rosariogarage-master-db.zip
          fi

          # Si ninguno funcionó, usar dawidd6 como fallback
          if [ ! -f "rosariogarage-master-db.zip" ] || [ ! -s "rosariogarage-master-db.zip" ]; then
            echo "⚠️ Descarga directa falló — usando fallback"
            echo "USAR_DAWIDD6=true" >> $GITHUB_ENV
            exit 0
          fi

          unzip -q rosariogarage-master-db.zip -d . 2>/dev/null || true
          rm -f rosariogarage-master-db.zip

          if [ -f "rosariogarage.db" ]; then
            echo "✅ BD extraída: $(du -h rosariogarage.db | cut -f1)"
          else
            echo "⚠️ No se encontró rosariogarage.db en el zip"
            echo "MASTER_DB_MISSING=true" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Fallback — dawidd6 si la API falló
        if: env.USAR_DAWIDD6 == 'true'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
          search_artifacts: true
          allow_forks: false

      - name: 📋 Verificar BD maestra anterior
        run: |
          if [ ! -f "rosariogarage.db" ]; then
            echo "⚠️  NO SE ENCONTRÓ BD MAESTRA ANTERIOR"
            echo "MASTER_DB_MISSING=true" >> $GITHUB_ENV
            exit 0
          fi

          TOTAL=$(sqlite3 rosariogarage.db \
            "SELECT COUNT(*) FROM vehicles;" 2>/dev/null || echo "0")
          ACTIVOS=$(sqlite3 rosariogarage.db \
            "SELECT COUNT(*) FROM vehicles WHERE activo=1;" 2>/dev/null || echo "0")
          SOLD=$(sqlite3 rosariogarage.db \
            "SELECT COUNT(*) FROM sold_vehicles;" 2>/dev/null || echo "tabla no existe aún")
          SIZE_MB=$(du -m rosariogarage.db | cut -f1)

          echo "✅ BD maestra anterior encontrada"
          ls -lh rosariogarage.db
          echo "   Total:         $TOTAL vehículos"
          echo "   Activos:       $ACTIVOS"
          echo "   Sold vehicles: $SOLD"
          echo "   Tamaño:        ${SIZE_MB}M"

          # Guardar métricas para el resumen
          echo "BD_TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "BD_SOLD=$SOLD" >> $GITHUB_ENV

      - name: 📁 Crear directorio para workers
        run: mkdir -p ./worker_downloads

      - name: 📥 Descargar BDs de todos los workers
        uses: actions/download-artifact@v4
        with:
          pattern: worker-*-db
          path: ./worker_downloads/
          merge-multiple: false

      - name: 📋 Organizar y verificar archivos de workers
        run: |
          echo "=== Moviendo archivos al directorio raíz ==="
          find ./worker_downloads -type f -name "*.db" | while read f; do
            echo "  Moviendo: $f"
            mv "$f" .
          done

          FOUND=0
          TOTAL_VEHICLES=0
          for i in {0..7}; do
            DB_FILE="rosariogarage_worker_${i}.db"
            if [ -f "$DB_FILE" ]; then
              COUNT=$(sqlite3 "$DB_FILE" \
                "SELECT COUNT(*) FROM vehicles;" 2>/dev/null || echo "0")
              echo "✅ Worker ${i}: ${COUNT} vehículos"
              FOUND=$((FOUND + 1))
              TOTAL_VEHICLES=$((TOTAL_VEHICLES + COUNT))
            else
              echo "❌ Worker ${i}: NO ENCONTRADO"
            fi
          done

          echo "════════════════════════════════════════"
          echo "📊 Workers: ${FOUND}/8 | Vehículos: ${TOTAL_VEHICLES}"
          echo "════════════════════════════════════════"

          if [ $FOUND -eq 0 ]; then
            echo "❌ ERROR CRÍTICO: Ningún worker disponible"
            exit 1
          fi

          echo "WORKERS_FOUND=${FOUND}" >> $GITHUB_ENV

      - name: 🔄 Ejecutar consolidación
        env:
          CONSOLIDATE_MODE: 'true'
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 15

      - name: 📊 Generar estadísticas
        if: success()
        run: |
          python3 << 'PYTHON_SCRIPT'
          import sqlite3
          from datetime import date
          import json

          def fmt(n):
              return f"{n:,}".replace(",", ".")

          try:
              conn = sqlite3.connect('rosariogarage.db')
              print("=" * 60)
              print("📊 RESUMEN DEL SCRAPING")
              print("=" * 60)

              total   = conn.execute("SELECT COUNT(*) FROM vehicles").fetchone()[0]
              activos = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE activo = 1"
              ).fetchone()[0]
              print(f"🚗 Total: {fmt(total)} | Activos: {fmt(activos)}")

              normalizados = conn.execute(
                  "SELECT COUNT(*) FROM vehicles "
                  "WHERE norm_status = 'full_match' AND activo = 1"
              ).fetchone()[0]
              parciales = conn.execute(
                  "SELECT COUNT(*) FROM vehicles "
                  "WHERE norm_status = 'partial_match' AND activo = 1"
              ).fetchone()[0]
              print(f"🔧 Full: {fmt(normalizados)} | Parcial: {fmt(parciales)}")

              today  = date.today().isoformat()
              nuevos = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE primera_vista = ?",
                  (today,)
              ).fetchone()[0]
              cambios = conn.execute(
                  "SELECT COUNT(*) FROM price_history WHERE fecha = ?",
                  (today,)
              ).fetchone()[0]
              print(f"📈 Nuevos hoy: {fmt(nuevos)} | Cambios precio: {fmt(cambios)}")

              archivados_hoy  = 0
              total_historico = 0
              try:
                  archivados_hoy = conn.execute(
                      "SELECT COUNT(*) FROM sold_vehicles WHERE fecha_archivo = ?",
                      (today,)
                  ).fetchone()[0]
                  total_historico = conn.execute(
                      "SELECT COUNT(*) FROM sold_vehicles"
                  ).fetchone()[0]
                  print(f"📦 Archivados hoy: {fmt(archivados_hoy)} "
                        f"| Histórico total: {fmt(total_historico)}")
              except Exception:
                  print("ℹ️ Tabla sold_vehicles no existe aún")

              metadata = {}
              for key, value in conn.execute(
                  "SELECT key, value FROM scrape_metadata"
              ):
                  metadata[key] = value

              summary = {
                  "total":           total,
                  "activos":         activos,
                  "nuevos_hoy":      nuevos,
                  "cambios_precio":  cambios,
                  "normalizados":    normalizados,
                  "parciales":       parciales,
                  "archivados_hoy":  archivados_hoy,
                  "total_historico": total_historico,
                  "dolar_mep":       float(metadata.get('last_dolar_mep', 0)),
                  "workers":         int(metadata.get('workers_consolidated', 0)),
              }
              with open("summary.json", "w") as f:
                  json.dump(summary, f)

              conn.close()
              print("=" * 60)

          except Exception as e:
              print(f"❌ Error: {e}")
              import traceback; traceback.print_exc()
              exit(1)
          PYTHON_SCRIPT

      - name: 🗜️ Optimizar BD si es grande
        run: |
          SIZE_MB=$(du -m rosariogarage.db | cut -f1)
          echo "💾 Tamaño: $(du -h rosariogarage.db | cut -f1)"
          if [ "$SIZE_MB" -gt 50 ]; then
            sqlite3 rosariogarage.db "VACUUM;"
            echo "✅ Optimizada: $(du -h rosariogarage.db | cut -f1)"
          fi

      - name: 📤 Subir BD consolidada (master)
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error

      - name: 📦 Subir BD para dashboard
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error

      - name: 🚀 Notificar dashboard
        if: success()
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          repository: Brunoact/Ros-Gar-Dash
          event-type: db-updated
          client-payload: >-
            {
              "run_id": "${{ github.run_id }}",
              "workers_ok": "${{ env.WORKERS_FOUND }}",
              "scrape_date": "${{ github.run_started_at }}"
            }

      - name: 📝 Resumen final
        if: always()
        run: |
          if [ -f "summary.json" ]; then
            ACTIVOS=$(jq -r '.activos          // "?"' summary.json)
            NUEVOS=$(jq -r '.nuevos_hoy        // "?"' summary.json)
            NORMALIZADOS=$(jq -r '.normalizados  // "?"' summary.json)
            PARCIALES=$(jq -r '.parciales      // "?"' summary.json)
            ARCHIVADOS=$(jq -r '.archivados_hoy // "?"' summary.json)
            HISTORICO=$(jq -r '.total_historico // "?"' summary.json)
          else
            ACTIVOS="?"; NUEVOS="?"; NORMALIZADOS="?"
            PARCIALES="?"; ARCHIVADOS="?"; HISTORICO="?"
          fi

          ALERTA=""
          if [ "${MASTER_DB_MISSING:-false}" = "true" ]; then
            ALERTA="> ⚠️ **BD maestra no encontrada — BD creada desde cero**"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ✅ Scraping Completado — $(date -u '+%Y-%m-%d %H:%M UTC')

          ${ALERTA}

          | Métrica          | Valor                     |
          |------------------|---------------------------|
          | Activos          | **${ACTIVOS}**            |
          | Nuevos hoy       | **${NUEVOS}**             |
          | Full match       | **${NORMALIZADOS}**       |
          | Partial match    | **${PARCIALES}**          |
          | Archivados hoy   | **${ARCHIVADOS}**         |
          | Histórico total  | **${HISTORICO}**          |
          | Workers OK       | **${WORKERS_FOUND:-?}/8** |
          EOF

  # ════════════════════════════════════════════════════════════
  # JOB 3: Limpieza de artifacts de workers
  # ════════════════════════════════════════════════════════════
  cleanup:
    name: 🧹 Limpieza
    runs-on: ubuntu-latest
    needs: consolidate
    if: always()

    steps:
      - name: 🗑️ Eliminar artifacts de workers
        uses: geekyeggo/delete-artifact@v4
        with:
          name: worker-*-db
          failOnError: false
