name: 🚗 RosarioGarage Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Modo debug (más logs)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  TOTAL_WORKERS: 8

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1: Scraping distribuido en 8 workers
  # ════════════════════════════════════════════════════════════
  scrape:
    name: 🔹 Worker ${{ matrix.worker_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        worker_id: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar Worker ${{ matrix.worker_id }}
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          # FIX: era '{{ inputs.debug }}' sin el signo $
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 30

      - name: 📊 Info de la BD del worker
        if: always()
        run: |
          # FIX: interpolación correcta con ${{ }} en bash
          DB_FILE="rosariogarage_worker_${{ matrix.worker_id }}.db"
          if [ -f "$DB_FILE" ]; then
            echo "✅ Archivo encontrado: $DB_FILE"
            ls -lh "$DB_FILE"
            echo ""
            echo "📊 Estadísticas:"
            sqlite3 "$DB_FILE" \
              "SELECT COUNT(*) || ' vehículos en worker ${{ matrix.worker_id }}' FROM vehicles;" \
              2>/dev/null || echo "⚠️ Sin datos"
            sqlite3 "$DB_FILE" \
              "SELECT key || ': ' || value FROM scrape_metadata;" \
              2>/dev/null || true
          else
            echo "❌ ERROR: No se generó $DB_FILE"
            echo "Archivos en directorio:"
            ls -la
            exit 1
          fi

      - name: 📤 Subir BD del worker
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker_id }}-db
          path: rosariogarage_worker_${{ matrix.worker_id }}.db
          # Workers solo necesitan vivir hasta que consolida
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════
  # JOB 2: Consolidar resultados de todos los workers
  # ════════════════════════════════════════════════════════════
  consolidate:
    name: 📊 Consolidar Resultados
    runs-on: ubuntu-latest
    needs: scrape
    if: always() && !cancelled() && needs.scrape.result != 'failure'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Descargar BD maestra anterior (si existe)
        id: download-master
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
          search_artifacts: true
          allow_forks: false

      - name: 📋 Verificar BD maestra anterior
        run: |
          if [ -f "rosariogarage.db" ]; then
            echo "✅ BD maestra anterior encontrada"
            ls -lh rosariogarage.db
            sqlite3 rosariogarage.db \
              "SELECT COUNT(*) || ' vehículos existentes' FROM vehicles;" \
              2>/dev/null || true
            # Verificar si ya tiene sold_vehicles
            sqlite3 rosariogarage.db \
              "SELECT COUNT(*) || ' registros en sold_vehicles' FROM sold_vehicles;" \
              2>/dev/null || echo "ℹ️ Tabla sold_vehicles aún no existe (se creará)"
          else
            echo "ℹ️ No existe BD maestra anterior (primera ejecución)"
            echo "  Se creará una nueva BD desde cero"
          fi

      - name: 📁 Crear directorio para workers
        run: mkdir -p ./worker_downloads

      - name: 📥 Descargar BDs de todos los workers
        uses: actions/download-artifact@v4
        with:
          pattern: worker-*-db
          path: ./worker_downloads/
          merge-multiple: false

      - name: 📋 Organizar archivos de workers
        run: |
          echo "=== Moviendo archivos al directorio raíz ==="
          find ./worker_downloads -type f -name "*.db" | while read f; do
            echo "  Moviendo: $f"
            mv "$f" .
          done

          echo ""
          echo "=== Verificación detallada ==="
          FOUND=0
          TOTAL_VEHICLES=0
          for i in {0..7}; do
            DB_FILE="rosariogarage_worker_${i}.db"
            if [ -f "$DB_FILE" ]; then
              COUNT=$(sqlite3 "$DB_FILE" \
                "SELECT COUNT(*) FROM vehicles;" 2>/dev/null || echo "0")
              echo "✅ Worker ${i}: ${COUNT} vehículos"
              FOUND=$((FOUND + 1))
              TOTAL_VEHICLES=$((TOTAL_VEHICLES + COUNT))
            else
              echo "❌ Worker ${i}: NO ENCONTRADO"
            fi
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "📊 Workers: ${FOUND}/8 | Vehículos: ${TOTAL_VEHICLES}"
          echo "════════════════════════════════════════"

          if [ $FOUND -eq 0 ]; then
            echo "❌ ERROR CRÍTICO: Ningún worker disponible"
            exit 1
          fi

      - name: 🔄 Ejecutar consolidación
        env:
          CONSOLIDATE_MODE: 'true'
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          # FIX: era '{{ inputs.debug }}' sin el signo $
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py

      - name: 📋 Verificar BD consolidada
        run: |
          if [ -f "rosariogarage.db" ]; then
            echo "✅ BD consolidada generada"
            ls -lh rosariogarage.db
            echo ""
            echo "📊 Estado final:"
            sqlite3 rosariogarage.db \
              "SELECT COUNT(*) || ' vehículos activos' FROM vehicles WHERE activo = 1;" \
              2>/dev/null || true
            sqlite3 rosariogarage.db \
              "SELECT COUNT(*) || ' registros en sold_vehicles' FROM sold_vehicles;" \
              2>/dev/null || true
            sqlite3 rosariogarage.db \
              "SELECT norm_status || ': ' || COUNT(*) FROM vehicles WHERE activo=1 GROUP BY norm_status ORDER BY COUNT(*) DESC;" \
              2>/dev/null || true
          else
            echo "❌ ERROR: No se generó rosariogarage.db"
            exit 1
          fi

      - name: 🗜️ Optimizar BD si es grande
        run: |
          SIZE_MB=$(du -m rosariogarage.db | cut -f1)
          echo "💾 Tamaño: $(du -h rosariogarage.db | cut -f1)"
          if [ $SIZE_MB -gt 50 ]; then
            sqlite3 rosariogarage.db "VACUUM;"
            echo "✅ Optimizada: $(du -h rosariogarage.db | cut -f1)"
          fi

      - name: 📤 Subir BD consolidada (master)
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          # FIX: era 90 días — excedía el límite de 500 MB
          # Con sold_vehicles el histórico no depende de esto
          retention-days: 30
          compression-level: 9
          if-no-files-found: error

      - name: 📦 Subir BD para dashboard
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-db
          path: rosariogarage.db
          # FIX: era 90 días — mismo problema de cuota
          retention-days: 30
          compression-level: 9
          if-no-files-found: error

      - name: 🚀 Notificar dashboard
        if: success()
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          repository: Brunoact/Ros-Gar-Dash
          event-type: db-updated
          client-payload: >-
            {
              "run_id": "${{ github.run_id }}",
              "scrape_date": "${{ github.event.repository.updated_at }}"
            }

      - name: 📝 Resumen
        if: always()
        run: |
          # summary.json lo genera el scraper al final de consolidate()
          if [ -f "summary.json" ]; then
            ACTIVOS=$(jq -r '.activos // "?"' summary.json)
            NUEVOS=$(jq -r '.nuevos_hoy // "?"' summary.json)
            NORMALIZADOS=$(jq -r '.normalizados // "?"' summary.json)
            PARCIALES=$(jq -r '.parciales // "?"' summary.json)
            ARCHIVADOS=$(jq -r '.archivados_hoy // "?"' summary.json)
            HISTORICO=$(jq -r '.total_historico // "?"' summary.json)
          else
            ACTIVOS="?"; NUEVOS="?"; NORMALIZADOS="?"
            PARCIALES="?"; ARCHIVADOS="?"; HISTORICO="?"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ✅ Scraping Completado

          | Métrica | Valor |
          |---------|-------|
          | Activos | **${ACTIVOS}** |
          | Nuevos hoy | **${NUEVOS}** |
          | Full match | **${NORMALIZADOS}** |
          | Partial match | **${PARCIALES}** |
          | Archivados hoy | **${ARCHIVADOS}** |
          | Histórico total | **${HISTORICO}** |
          EOF
