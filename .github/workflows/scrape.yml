# .github/workflows/scrape.yml
name: 🚗 RosarioGarage Scraper

on:
  #schedule:
    #- cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Modo debug (más logs)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  TOTAL_WORKERS: 8

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1: Scraping distribuido en 8 workers
  # ══════════════════════════════════════════════════════════════
  scrape:
    name: 🔹 Worker ${{ matrix.worker_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        worker_id: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar Worker ${{ matrix.worker_id }}
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 30

      - name: 📊 Info de la BD del worker
        if: always()
        run: |
          DB_FILE="rosariogarage_worker_${{ matrix.worker_id }}.db"
          if [ -f "$DB_FILE" ]; then
            echo "✅ Archivo encontrado: $DB_FILE"
            ls -lh "$DB_FILE"
            echo ""
            echo "📊 Estadísticas:"
            sqlite3 "$DB_FILE" "SELECT COUNT(*) as 'Vehículos en worker ${{ matrix.worker_id }}:' FROM vehicles;"
            sqlite3 "$DB_FILE" "SELECT key, value FROM scrape_metadata;"
          else
            echo "❌ ERROR: No se generó $DB_FILE"
            echo "Archivos en directorio:"
            ls -la
            exit 1
          fi

      - name: 📤 Subir BD del worker
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker_id }}-db
          path: rosariogarage_worker_${{ matrix.worker_id }}.db
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════
  # JOB 2: Consolidar resultados de todos los workers
  # ══════════════════════════════════════════════════════════════
  consolidate:
    name: 📊 Consolidar Resultados
    runs-on: ubuntu-latest
    needs: scrape
    if: always() && !cancelled() && needs.scrape.result != 'failure'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Descargar BD maestra de ejecución anterior
        id: download-master
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: rosariogarage-master-db
          workflow: scrape.yml
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: 📋 Verificar BD maestra anterior
        run: |
          if [ -f "rosariogarage.db" ]; then
            echo "✅ BD maestra anterior encontrada"
            ls -lh rosariogarage.db
            sqlite3 rosariogarage.db "SELECT COUNT(*) as 'Vehículos existentes:' FROM vehicles;"
          else
            echo "ℹ️ No existe BD maestra anterior (primera ejecución)"
          fi

      - name: 📁 Crear directorio para workers
        run: mkdir -p ./worker_downloads

      - name: 📥 Descargar BDs de todos los workers
        uses: actions/download-artifact@v4
        with:
          pattern: worker-*-db
          path: ./worker_downloads/
          merge-multiple: false

      - name: 🔎 Diagnóstico de artifacts descargados
        run: |
          echo "=== Contenido de worker_downloads ==="
          if [ -d "./worker_downloads" ]; then
            find ./worker_downloads -type f | sort || echo "Directorio vacío"
            echo ""
            echo "Estructura completa:"
            ls -laR ./worker_downloads/ || echo "Vacío"
          else
            echo "❌ Directorio worker_downloads NO existe"
            echo "Archivos en directorio actual:"
            ls -la
          fi

      - name: 📋 Organizar archivos de workers
        run: |
          echo "=== Moviendo archivos al directorio raíz ==="

          FOUND_FILES=$(find ./worker_downloads -type f -name "rosariogarage_worker_*.db" 2>/dev/null)

          if [ -z "$FOUND_FILES" ]; then
            echo "⚠️ No se encontraron archivos con patrón rosariogarage_worker_*.db"
            echo "Buscando cualquier .db descargado..."
            find ./worker_downloads -type f -name "*.db" 2>/dev/null | while read f; do
              echo "  Encontrado: $f"
              mv "$f" .
            done
          else
            echo "$FOUND_FILES" | while read f; do
              echo "  Moviendo: $f"
              mv "$f" .
            done
          fi

          echo ""
          echo "=== Archivos .db en directorio actual ==="
          ls -lh *.db 2>/dev/null || echo "No hay archivos .db"
          echo ""
          echo "=== Verificación detallada de workers ==="
          FOUND=0
          TOTAL_VEHICLES=0
          for i in {0..7}; do
            DB_FILE="rosariogarage_worker_${i}.db"
            if [ -f "$DB_FILE" ]; then
              SIZE=$(du -h "$DB_FILE" | cut -f1)
              COUNT=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM vehicles;" 2>/dev/null || echo "0")
              echo "✅ Worker ${i}: ${SIZE} - ${COUNT} vehículos"
              FOUND=$((FOUND + 1))
              TOTAL_VEHICLES=$((TOTAL_VEHICLES + COUNT))
            else
              echo "❌ Worker ${i}: NO ENCONTRADO"
            fi
          done
          echo ""
          echo "════════════════════════════════════════"
          echo "📊 RESUMEN: ${FOUND}/8 workers encontrados"
          echo "🚗 Total vehículos en workers: ${TOTAL_VEHICLES}"
          echo "════════════════════════════════════════"

          if [ $FOUND -eq 0 ]; then
            echo "❌ ERROR CRÍTICO: No se encontró ningún archivo de worker"
            exit 1
          fi
          if [ $FOUND -lt 4 ]; then
            echo "⚠️ ADVERTENCIA: Solo ${FOUND}/8 workers disponibles"
          fi

      - name: 🔄 Ejecutar consolidación
        env:
          CONSOLIDATE_MODE: 'true'
          TOTAL_WORKERS: ${{ env.TOTAL_WORKERS }}
          DEBUG_MODE: ${{ inputs.debug || 'false' }}
        run: python scraper_rosariogarage.py
        timeout-minutes: 15

      - name: 📊 Generar estadísticas detalladas
        if: success()
        run: |
          python3 << 'PYTHON_SCRIPT'
          import sqlite3
          from datetime import date, datetime
          import json
          import os

          def format_number(n):
              return f"{n:,}".replace(",", ".")

          try:
              conn = sqlite3.connect('rosariogarage.db')

              print("=" * 60)
              print("📊 RESUMEN DEL SCRAPING - ROSARIOGARAGE")
              print("=" * 60)
              print(f"📅 Fecha: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}")
              print()

              total     = conn.execute("SELECT COUNT(*) FROM vehicles").fetchone()[0]
              activos   = conn.execute("SELECT COUNT(*) FROM vehicles WHERE activo = 1").fetchone()[0]
              inactivos = conn.execute("SELECT COUNT(*) FROM vehicles WHERE activo = 0").fetchone()[0]

              print(f"🚗 VEHÍCULOS")
              print(f"   Total en BD:     {format_number(total)}")
              print(f"   ├─ Activos:      {format_number(activos)}")
              print(f"   └─ Inactivos:    {format_number(inactivos)}")
              print()

              normalizados = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE norm_status = 'full_match' AND activo = 1"
              ).fetchone()[0]
              parciales = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE norm_status = 'partial_match' AND activo = 1"
              ).fetchone()[0]
              no_match = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE norm_status IN ('marca_only', 'no_match', 'raw', 'pending') AND activo = 1"
              ).fetchone()[0]

              print(f"🔧 NORMALIZACIÓN (activos)")
              print(f"   ├─ Completa:     {format_number(normalizados)}")
              print(f"   ├─ Parcial:      {format_number(parciales)}")
              print(f"   └─ Sin match:    {format_number(no_match)}")
              print()

              # ── NUEVOS v2.6: Estadísticas de campos nuevos ──
              try:
                  meta_stats = conn.execute("""
                      SELECT
                        SUM(CASE WHEN puertas IS NOT NULL THEN 1 ELSE 0 END),
                        SUM(CASE WHEN traccion IS NOT NULL THEN 1 ELSE 0 END),
                        SUM(CASE WHEN tiene_gnc = 1 THEN 1 ELSE 0 END),
                        SUM(CASE WHEN es_0km = 1 THEN 1 ELSE 0 END),
                        SUM(CASE WHEN version_raw IS NOT NULL THEN 1 ELSE 0 END),
                        SUM(CASE WHEN descripcion IS NOT NULL THEN 1 ELSE 0 END)
                      FROM vehicles WHERE activo = 1
                  """).fetchone()
                  print(f"📋 METADATA EXTRAÍDA (activos)")
                  print(f"   ├─ Con puertas:      {format_number(meta_stats[0] or 0)}")
                  print(f"   ├─ Con tracción:     {format_number(meta_stats[1] or 0)}")
                  print(f"   ├─ Con GNC:          {format_number(meta_stats[2] or 0)}")
                  print(f"   ├─ 0km:              {format_number(meta_stats[3] or 0)}")
                  print(f"   ├─ Con version_raw:  {format_number(meta_stats[4] or 0)}")
                  print(f"   └─ Con descripción:  {format_number(meta_stats[5] or 0)}")
                  print()
              except Exception:
                  pass

              today = date.today().isoformat()
              nuevos_hoy = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE primera_vista = ?", (today,)
              ).fetchone()[0]
              cambios_precio_hoy = conn.execute(
                  "SELECT COUNT(*) FROM price_history WHERE fecha = ?", (today,)
              ).fetchone()[0]
              actualizados_hoy = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE ultima_vista = ? AND primera_vista != ?",
                  (today, today)
              ).fetchone()[0]

              print(f"📈 CAMBIOS HOY")
              print(f"   Nuevos:          {format_number(nuevos_hoy)}")
              print(f"   Actualizados:    {format_number(actualizados_hoy)}")
              print(f"   Cambios precio:  {format_number(cambios_precio_hoy)}")
              print()

              precio_stats = conn.execute("""
                  SELECT MIN(precio_usd) as min_precio,
                         MAX(precio_usd) as max_precio,
                         AVG(precio_usd) as avg_precio,
                         COUNT(*) as count
                  FROM vehicles
                  WHERE activo = 1
                    AND precio_usd IS NOT NULL
                    AND precio_usd > 0
              """).fetchone()

              if precio_stats[3] > 0:
                  print(f"💰 RANGO DE PRECIOS (USD)")
                  print(f"   Mínimo:          ${format_number(int(precio_stats[0]))}")
                  print(f"   Máximo:          ${format_number(int(precio_stats[1]))}")
                  print(f"   Promedio:        ${format_number(int(precio_stats[2]))}")
                  print()

              print(f"🏭 TOP 10 MARCAS (Activos)")
              for marca, count in conn.execute("""
                  SELECT marca, COUNT(*) as c
                  FROM vehicles
                  WHERE activo = 1 AND marca IS NOT NULL AND marca != ''
                  GROUP BY marca ORDER BY c DESC LIMIT 10
              """):
                  bar = '█' * min(30, max(1, int(count * 30 / max(activos, 1))))
                  print(f"   {marca:15s} {count:5} {bar}")
              print()

              particulares = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE activo = 1 AND es_particular = 1"
              ).fetchone()[0]
              agencias = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE activo = 1 AND es_particular = 0"
              ).fetchone()[0]

              print(f"👤 TIPO DE VENDEDOR (Activos)")
              print(f"   Particulares:    {format_number(particulares)}")
              print(f"   Agencias:        {format_number(agencias)}")
              print()

              con_urgencia = conn.execute(
                  "SELECT COUNT(*) FROM vehicles WHERE activo = 1 AND tiene_urgencia = 1"
              ).fetchone()[0]
              print(f"🔥 Con señales de urgencia: {format_number(con_urgencia)}")
              print()

              metadata = {}
              for key, value in conn.execute("SELECT key, value FROM scrape_metadata"):
                  metadata[key] = value

              if 'last_dolar_mep' in metadata:
                  print(f"💵 Dólar MEP: ${float(metadata['last_dolar_mep']):.2f}")
              if 'workers_consolidated' in metadata:
                  print(f"👷 Workers consolidados: {metadata['workers_consolidated']}")
              if 'rate_limits_429' in metadata and int(metadata.get('rate_limits_429', 0)) > 0:
                  print(f"⚠️ Rate limits detectados: {metadata['rate_limits_429']}")

              total_history = conn.execute("SELECT COUNT(*) FROM price_history").fetchone()[0]
              print(f"📜 Registros de historial: {format_number(total_history)}")

              try:
                  repubs = conn.execute("SELECT COUNT(*) FROM republication_log").fetchone()[0]
                  if repubs > 0:
                      print(f"🔁 Re-publicaciones detectadas: {format_number(repubs)}")
              except Exception:
                  pass

              print("=" * 60)

              summary_data = {
                  "total":            total,
                  "activos":          activos,
                  "nuevos_hoy":       nuevos_hoy,
                  "actualizados_hoy": actualizados_hoy,
                  "cambios_precio":   cambios_precio_hoy,
                  "normalizados":     normalizados,
                  "parciales":        parciales,
                  "particulares":     particulares,
                  "agencias":         agencias,
                  "con_urgencia":     con_urgencia,
                  "dolar_mep":        float(metadata.get('last_dolar_mep', 0)),
                  "workers":          int(metadata.get('workers_consolidated', 0)),
                  "con_puertas":      int(meta_stats[0] or 0) if meta_stats else 0,
                  "con_traccion":     int(meta_stats[1] or 0) if meta_stats else 0,
                  "con_gnc":          int(meta_stats[2] or 0) if meta_stats else 0,
                  "con_0km":          int(meta_stats[3] or 0) if meta_stats else 0,
              }
              with open("summary.json", "w") as f:
                  json.dump(summary_data, f)

              conn.close()

          except Exception as e:
              print(f"❌ Error generando estadísticas: {e}")
              import traceback
              traceback.print_exc()
              exit(1)
          PYTHON_SCRIPT

      - name: 💾 Optimizar base de datos
        run: |
          SIZE_MB=$(du -m rosariogarage.db | cut -f1)
          SIZE_HR=$(du -h rosariogarage.db | cut -f1)
          echo "💾 Tamaño actual: $SIZE_HR"
          if [ $SIZE_MB -gt 50 ]; then
            echo "🔧 Ejecutando VACUUM para optimizar..."
            sqlite3 rosariogarage.db "VACUUM;"
            NEW_SIZE=$(du -h rosariogarage.db | cut -f1)
            echo "✅ Nuevo tamaño: $NEW_SIZE"
          fi

      - name: 📤 Subir BD consolidada (uso interno scraper)
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-master-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error

      - name: 📦 Subir DB para dashboard
        uses: actions/upload-artifact@v4
        with:
          name: rosariogarage-db
          path: rosariogarage.db
          retention-days: 90
          compression-level: 9
          if-no-files-found: error

      - name: 📅 Obtener fecha actual
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 🚀 Disparar deploy en repo dashboard
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          repository: Brunoact/Ros-Gar-Dash
          event-type: db-updated
          client-payload: |
            {
              "run_id": "${{ github.run_id }}",
              "scrape_date": "${{ steps.date.outputs.date }}"
            }

      - name: 📝 Crear resumen del workflow
        if: always()
        run: |
          if [ -f summary.json ]; then
            ACTIVOS=$(jq -r '.activos' summary.json)
            NUEVOS=$(jq -r '.nuevos_hoy' summary.json)
            ACTUALIZADOS=$(jq -r '.actualizados_hoy' summary.json)
            CAMBIOS=$(jq -r '.cambios_precio' summary.json)
            NORMALIZADOS=$(jq -r '.normalizados' summary.json)
            PARCIALES=$(jq -r '.parciales' summary.json)
            PARTICULARES=$(jq -r '.particulares' summary.json)
            AGENCIAS=$(jq -r '.agencias' summary.json)
            URGENCIA=$(jq -r '.con_urgencia' summary.json)
            DOLAR=$(jq -r '.dolar_mep' summary.json)
            WORKERS=$(jq -r '.workers' summary.json)
            CON_PUERTAS=$(jq -r '.con_puertas // 0' summary.json)
            CON_TRACCION=$(jq -r '.con_traccion // 0' summary.json)
            CON_GNC=$(jq -r '.con_gnc // 0' summary.json)
            CON_0KM=$(jq -r '.con_0km // 0' summary.json)
          else
            ACTIVOS="Error"; NUEVOS="Error"; ACTUALIZADOS="Error"
            CAMBIOS="Error"; NORMALIZADOS="Error"; PARCIALES="Error"
            PARTICULARES="Error"; AGENCIAS="Error"; URGENCIA="Error"
            DOLAR="Error"; WORKERS="Error"
            CON_PUERTAS="Error"; CON_TRACCION="Error"
            CON_GNC="Error"; CON_0KM="Error"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ✅ Scraping RosarioGarage Completado

          **Fecha:** $(date +'%Y-%m-%d %H:%M:%S UTC')

          ## 📊 Resumen

          | Métrica | Valor |
          |---------|-------|
          | 👷 Workers consolidados | **${WORKERS}/8** |
          | 🚗 Vehículos activos | **${ACTIVOS}** |
          | 🆕 Nuevos hoy | **${NUEVOS}** |
          | 🔄 Actualizados | **${ACTUALIZADOS}** |
          | 💰 Cambios de precio | **${CAMBIOS}** |
          | 💵 Dólar MEP | **\$${DOLAR}** |

          ## 🔧 Normalización

          | Estado | Cantidad |
          |--------|----------|
          | ✅ Completa (marca+modelo+versión) | **${NORMALIZADOS}** |
          | 🟡 Parcial (marca+modelo) | **${PARCIALES}** |

          ## 📋 Metadata Extraída

          | Campo | Cantidad |
          |-------|----------|
          | 🚪 Con puertas | **${CON_PUERTAS}** |
          | 🛞 Con tracción | **${CON_TRACCION}** |
          | ⛽ Con GNC | **${CON_GNC}** |
          | 🆕 0km | **${CON_0KM}** |

          ## 👤 Vendedores

          | Tipo | Cantidad |
          |------|----------|
          | 👤 Particulares | **${PARTICULARES}** |
          | 🏢 Agencias | **${AGENCIAS}** |
          | 🔥 Con urgencia | **${URGENCIA}** |

          ## 📥 Artifacts generados

          | Artifact | Uso | Retención |
          |----------|-----|-----------|
          | \`rosariogarage-master-db\` | Uso interno del scraper | 90 días |
          | \`rosariogarage-db\` | Dashboard (Repo 2) | 90 días |

          ---
          *Ver logs del paso "Generar estadísticas detalladas" para más información*
          EOF

  # ══════════════════════════════════════════════════════════════
  # JOB 3: Limpieza de artifacts de workers
  # ══════════════════════════════════════════════════════════════
  cleanup:
    name: 🧹 Limpieza
    runs-on: ubuntu-latest
    needs: consolidate
    if: always()

    steps:
      - name: 🗑️ Eliminar artifacts de workers
        uses: geekyeggo/delete-artifact@v4
        with:
          name: worker-*-db
          failOnError: false

  # ══════════════════════════════════════════════════════════════
  # JOB 4: Notificación en caso de error
  # ══════════════════════════════════════════════════════════════
  notify-failure:
    name: 🚨 Notificar Fallo
    runs-on: ubuntu-latest
    needs: [scrape, consolidate]
    if: failure()

    steps:
      - name: 📝 Registrar fallo en summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ❌ Scraping Fallido

          **Fecha:** $(date +'%Y-%m-%d %H:%M:%S UTC')

          El proceso de scraping ha fallado. Revisar los logs para más detalles.

          ## 🔍 Pasos para diagnosticar:
          1. Revisar logs del paso "🔎 Diagnóstico de artifacts descargados"
          2. Verificar el paso "📋 Organizar archivos de workers"
          3. Comprobar si el sitio web está accesible
          4. Revisar límites de rate limiting
          5. Verificar que el catálogo de vehículos existe en config/

          ---
          *El workflow se reintentará en la próxima ejecución programada*
          EOF
